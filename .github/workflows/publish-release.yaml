name: Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag like v1.1.0

jobs:
  build:
    # Essential: .NET Framework requires a Windows environment
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: CDT.sln # Change to your .sln path
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x86 # Change to x86 or x64 if required by your desktop app

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Installs MSBuild onto the runner path
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Installs NuGet CLI to restore legacy packages
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    # Restores packages based on your solution file
    - name: Restore NuGet Packages
      run: nuget restore $env:SOLUTION_FILE_PATH

    # Compiles the Desktop application
    - name: Build Desktop Application
      run: |
        msbuild $env:SOLUTION_FILE_PATH /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform="$env:BUILD_PLATFORM" /t:Publish /p:PublishDir=./publish-output/

    # Optional: Uploads the compiled binaries (e.g., .exe, .dll) as an artifact
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-release
        path: ${{ github.workspace }}/publish-output/
        if-no-files-found: error

  # 2. Run the release job after the build workflow finishes successfully
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-release
          path: release-contents

      - name: Archive Release Assets
        run: |
          cd release-contents
          zip -r ../CDT-Release-${{ github.ref_name }}.zip .

      - name: Create Official GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: "Automated production release assets for version ${{ github.ref_name }}."
          artifacts: "CDT-Release-${{ github.ref_name }}.zip"
          allowUpdates: true
